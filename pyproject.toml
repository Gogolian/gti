[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gti"
version = "0.2.0"
description = "Symmetric, multiplexed messaging (chat, file transfer) over a single Bluetooth Classic RFCOMM link."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gogolian" }]
keywords = ["bluetooth", "rfcomm", "messaging", "chat", "file-transfer", "multiplexing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications",
]
dependencies = ["aiohttp>=3.9,<4", "textual>=0.47,<1"]

[project.optional-dependencies]
# Real Bluetooth Classic RFCOMM radios (platform libraries).  The core library,
# the in-memory loopback, and the whole test-suite need none of these.
# macOS drives IOBluetooth through pyobjc; Foundation/NSObject come from Cocoa.
macos = [
    "pyobjc-framework-Cocoa>=9.0; sys_platform=='darwin'",
    "pyobjc-framework-CoreBluetooth>=9.0; sys_platform=='darwin'",
]
windows = [
    "winrt-runtime>=2.0; sys_platform=='win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform=='win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform=='win32'",
    "winrt-Windows.Devices.Bluetooth>=2.0; sys_platform=='win32'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=2.0; sys_platform=='win32'",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=2.0; sys_platform=='win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform=='win32'",
]
llm = ["aiohttp>=3.9,<4"]
dev = ["mypy>=1.0,<1.19", "aiohttp>=3.9,<4"]

[project.scripts]
gti = "gti.cli:main"

[project.urls]
Homepage = "https://github.com/Gogolian/gti"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gti = ["py.typed"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["winrt.*"]
ignore_missing_imports = true
